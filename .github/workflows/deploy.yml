name: Deploy to Production (AWS App Runner)

# Triggers automatically on every push to main branch
on:
  push:
    branches: [main]
  workflow_dispatch:   # Allow manual trigger from GitHub UI

env:
  AWS_REGION: us-east-2
  ECR_REPO: 596294129245.dkr.ecr.us-east-2.amazonaws.com/kincaid-iq-app
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-2:596294129245:service/kincaid-iq-service/aa9ac9c07bdd409580121bdc1e73502c

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    # Only runs when there is a real push to main (not PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials from GitHub Secrets ─────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 3. Authenticate Docker with private ECR ───────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Set up Node.js and build the React frontend ────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies & build frontend
        run: |
          npm ci
          npx vite build
          echo "Frontend build complete. dist/ contents:"
          ls -lh dist/

      # ── 5. Build and push Docker image to ECR ────────────────────────────────
      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ env.ECR_REPO }}:${{ github.sha }}
          LATEST_TAG=${{ env.ECR_REPO }}:latest
          echo "Building image: $IMAGE_TAG"
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from $LATEST_TAG \
            -t $IMAGE_TAG \
            -t $LATEST_TAG \
            .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Push Docker image to ECR
        run: |
          docker push ${{ env.IMAGE_TAG }}
          docker push ${{ env.LATEST_TAG }}
          echo "Pushed ${{ env.IMAGE_TAG }} to ECR"

      # ── 6. Trigger App Runner redeployment ────────────────────────────────────
      - name: Trigger App Runner deployment
        run: |
          echo "Triggering App Runner deployment..."
          aws apprunner start-deployment \
            --service-arn "${{ env.APP_RUNNER_SERVICE_ARN }}" \
            --region "${{ env.AWS_REGION }}"
          echo "Deployment started. Monitor at:"
          echo "https://us-east-2.console.aws.amazon.com/apprunner/home?region=us-east-2#/services"

      # ── 7. Wait for App Runner to become healthy ──────────────────────────────
      - name: Wait for healthy deployment
        run: |
          echo "Polling App Runner service status (max 5 minutes)..."
          for i in $(seq 1 30); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ env.APP_RUNNER_SERVICE_ARN }}" \
              --query 'Service.Status' --output text)
            echo "  Attempt $i/30 — Status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Service is RUNNING!"
              break
            fi
            sleep 10
          done

      # ── 8. Smoke test — verify the health endpoint responds ───────────────────
      - name: Smoke test health endpoint
        run: |
          sleep 15  # Give App Runner a moment to route traffic
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://wncy3cpxru.us-east-2.awsapprunner.com/api/health)
          echo "Health endpoint returned HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "[FAIL] Health check returned $HTTP_STATUS — deployment may have issues"
            exit 1
          fi
          echo "[PASS] Health check OK"

      # ── 9. Report deployment summary ─────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "=============================="
          echo " Kincaid IQ Deployment Summary"
          echo "=============================="
          echo "  Branch:   ${{ github.ref_name }}"
          echo "  Commit:   ${{ github.sha }}"
          echo "  Image:    ${{ env.IMAGE_TAG }}"
          echo "  Live URL: https://wncy3cpxru.us-east-2.awsapprunner.com"
          echo "=============================="
